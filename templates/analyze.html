{% extends "base.html" %}
{% block title %}企業分析 - DPA{% endblock %}
{% block content %}
<div class="space-y-8">
  <h2 class="text-2xl font-bold text-slate-100">企業分析＆自動追加</h2>
  <div class="bg-slate-800 rounded-xl border border-slate-700 p-6 max-w-lg">
    <label class="block text-slate-400 text-sm mb-2">コード（例: 7203 日本株 / AAPL 米国株）</label>
    <div class="flex gap-2">
      <input
        type="text"
        id="ticker-input"
        placeholder="7203 または AAPL"
        class="flex-1 px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-amber-500 focus:border-transparent"
      />
      <button type="button" id="btn-analyze" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold rounded-lg transition">分析実行</button>
    </div>
    <p id="analyze-msg" class="mt-3 text-sm text-slate-400"></p>
    <div id="analyze-loading" class="mt-4 hidden items-center gap-2">
      <i class="fas fa-spinner fa-spin text-amber-400"></i>
      <span class="text-slate-400">分析中…</span>
    </div>
    <div id="analyze-result" class="mt-4 hidden space-y-4">
      <p class="text-green-500 font-medium" id="result-message"></p>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <div class="bg-slate-700/50 rounded p-2"><span class="text-slate-500">Value:</span> <span id="result-value" class="text-slate-200"></span></div>
        <div class="bg-slate-700/50 rounded p-2"><span class="text-slate-500">Safety:</span> <span id="result-safety" class="text-slate-200"></span></div>
        <div class="bg-slate-700/50 rounded p-2"><span class="text-slate-500">Momentum:</span> <span id="result-momentum" class="text-slate-200"></span></div>
        <div class="bg-slate-700/50 rounded p-2"><span class="text-slate-500">Total:</span> <span id="result-total" class="text-amber-400 font-semibold"></span></div>
      </div>
    </div>
  </div>

  <section class="space-y-4">
    <h3 class="text-lg font-semibold text-slate-200">登録銘柄一覧</h3>
    <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-slate-700/80 text-slate-400">
            <tr>
              <th class="px-4 py-3">コード</th>
              <th class="px-4 py-3">銘柄名</th>
              <th class="px-4 py-3">状態</th>
              <th class="px-4 py-3 text-right">Total</th>
              <th class="px-4 py-3 text-right">終値</th>
            </tr>
          </thead>
          <tbody id="wl-index-body" class="divide-y divide-slate-700">
            <tr><td colspan="5" class="px-4 py-6 text-slate-500 text-center">読み込み中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

</div>

<script id="analysis-index-data" type="application/json">{{ analysis_index_items | tojson }}</script>
<script>
// base.html 末尾で読み込まれる ticker_detail_modal.js を待ってから初期化する
(function ready(fn) {
  if (document.readyState !== 'loading') return fn();
  document.addEventListener('DOMContentLoaded', fn);
})(function() {
  let INITIAL_INDEX = [];
  try {
    const el = document.getElementById('analysis-index-data');
    INITIAL_INDEX = el && el.textContent ? JSON.parse(el.textContent) : [];
  } catch (e) {
    INITIAL_INDEX = [];
  }
  const input = document.getElementById('ticker-input');
  const btn = document.getElementById('btn-analyze');
  const msg = document.getElementById('analyze-msg');
  const loading = document.getElementById('analyze-loading');
  const result = document.getElementById('analyze-result');
  const resultMessage = document.getElementById('result-message');
  const resultValue = document.getElementById('result-value');
  const resultSafety = document.getElementById('result-safety');
  const resultMomentum = document.getElementById('result-momentum');
  const resultTotal = document.getElementById('result-total');
  const indexBody = document.getElementById('wl-index-body');
  let indexItems = [];

  function normalizeTicker(str) {
    const toHalf = str.replace(/[０-９Ａ-Ｚａ-ｚ]/g, function(c) {
      const code = c.charCodeAt(0);
      if (code >= 0xFF10 && code <= 0xFF19) return String.fromCharCode(code - 0xFEE0);
      if (code >= 0xFF21 && code <= 0xFF3A) return String.fromCharCode(code - 0xFEE0);
      if (code >= 0xFF41 && code <= 0xFF5A) return String.fromCharCode(code - 0xFEE0);
      return c;
    });
    return toHalf.replace(/[^A-Za-z0-9.]/g, '').toUpperCase();
  }

  TickerDetailModal.init({
    syncUrlOnOpen: true,
    onOpen: function(ticker) {
      input.value = ticker.replace(/\.T$/i, '');
    },
    onAnalyzeRequest: function(ticker) {
      runAnalyze(normalizeTicker(ticker.replace(/\.T$/i, '')));
    },
  });

  function renderIndex(items) {
    indexItems = items || [];
    if (!indexItems.length) {
      indexBody.innerHTML = '<tr><td colspan="5" class="px-4 py-6 text-slate-500 text-center">ウォッチリストが空です</td></tr>';
      return;
    }
    indexBody.innerHTML = indexItems.map(function(row) {
      const score = row.total_score != null ? Number(row.total_score).toFixed(1) : '-';
      const close = row.last_close != null ? Number(row.last_close).toLocaleString() : '-';
      const statusCls = row.status === 'HOLDING' ? 'text-green-400' : 'text-slate-300';
      const unanalyzed = !row.has_output ? ' <span class="text-xs text-amber-400">未分析</span>' : '';
      const nameAttr = (row.name || '-').replace(/"/g, '&quot;');
      return '<tr class="hover:bg-slate-700/50 cursor-pointer wl-row" data-ticker="' + row.ticker + '" data-has-output="' + (row.has_output ? '1' : '0') + '" data-name="' + nameAttr + '">' +
        '<td class="px-4 py-3 font-mono text-amber-300/90">' + row.ticker + '</td>' +
        '<td class="px-4 py-3">' + (row.name || '-') + unanalyzed + '</td>' +
        '<td class="px-4 py-3 ' + statusCls + '">' + (row.status || 'WATCHING') + '</td>' +
        '<td class="px-4 py-3 text-right">' + score + '</td>' +
        '<td class="px-4 py-3 text-right">' + close + '</td></tr>';
    }).join('');
    indexBody.querySelectorAll('.wl-row').forEach(function(tr) {
      tr.addEventListener('click', function(e) {
        // base.html の [data-ticker] 委譲が二重発火しないように
        e.stopPropagation();
        indexBody.querySelectorAll('.wl-row').forEach(r => r.classList.remove('bg-slate-700'));
        tr.classList.add('bg-slate-700');
        TickerDetailModal.open({
          ticker: tr.dataset.ticker,
          hasOutput: tr.dataset.hasOutput === '1',
          name: tr.dataset.name,
        });
      });
    });
  }

  function loadIndex() {
    if (Array.isArray(INITIAL_INDEX) && INITIAL_INDEX.length > 0) {
      renderIndex(INITIAL_INDEX);
    }
    dpaFetch('/api/watchlist/analysis-index')
      .then(function(r) {
        if (!r.ok) {
          return r.json().then(function(d) {
            const detail = d && d.detail;
            const msg = typeof detail === 'string' ? detail : (Array.isArray(detail) ? JSON.stringify(detail) : ('HTTP ' + r.status));
            throw new Error(msg);
          });
        }
        return r.json();
      })
      .then(function(data) {
        const items = data.items || [];
        renderIndex(items);
        if (!items.length) return;
        const params = new URLSearchParams(window.location.search);
        const t = params.get('ticker');
        if (t) {
          const row = items.find(function(i) { return i.ticker === t || i.ticker === normalizeTicker(t); });
          TickerDetailModal.open({
            ticker: row ? row.ticker : normalizeTicker(t),
            hasOutput: row ? row.has_output : true,
            name: row ? row.name : undefined,
          });
        }
      })
      .catch(function(e) {
        if (indexItems.length > 0) return;
        const hint = (e && e.message) ? e.message : '不明なエラー';
        indexBody.innerHTML = '<tr><td colspan="5" class="px-4 py-6 text-red-400 text-center">一覧の取得に失敗しました: ' + hint + '</td></tr>';
      });
  }

  function runAnalyze(ticker) {
    msg.textContent = '';
    result.classList.add('hidden');
    loading.classList.remove('hidden');
    loading.classList.add('flex');
    btn.disabled = true;
    return dpaFetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ticker: ticker })
    }).then(r => {
      if (!r.ok) return r.json().then(d => { throw new Error(d.detail || r.statusText); });
      return r.json();
    }).then(data => {
      loading.classList.add('hidden');
      result.classList.remove('hidden');
      resultMessage.textContent = data.message || '完了';
      resultValue.textContent = data.value_score != null ? Number(data.value_score).toFixed(1) : '-';
      resultSafety.textContent = data.safety_score != null ? Number(data.safety_score).toFixed(1) : '-';
      resultMomentum.textContent = data.momentum_score != null ? Number(data.momentum_score).toFixed(1) : '-';
      resultTotal.textContent = data.total_score != null ? Number(data.total_score).toFixed(1) : '-';
      loadIndex();
      TickerDetailModal.open({ ticker: data.ticker, hasOutput: true, name: data.name });
      TickerDetailModal.fillDetail(data);
    }).catch(e => {
      loading.classList.add('hidden');
      msg.textContent = 'エラー: ' + (e.message || '分析に失敗しました');
      msg.className = 'mt-3 text-sm text-red-400';
    }).finally(() => { btn.disabled = false; });
  }

  btn.addEventListener('click', function() {
    const ticker = normalizeTicker((input.value || '').trim());
    if (!ticker || ticker.length < 2 || ticker.length > 20) {
      msg.textContent = 'コードは 2〜20 文字の英数字で入力してください（例: 7203, AAPL）。';
      msg.className = 'mt-3 text-sm text-amber-400';
      return;
    }
    runAnalyze(ticker);
  });

  loadIndex();
});
</script>
{% endblock %}
